name: Bug report
description: Something did not work the way this repository says it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security problem here. Use the private advisories form instead.
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: The parameters you passed and the text the tool returned, copied as text.
      placeholder: |
        $ node docs/demo/ask.mjs
        ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you installed, and the Pi and Node versions.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS and version, and whether Pi ran with a dialog-capable UI.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: A small reproduction, or what you already tried.
    validations:
      required: false
